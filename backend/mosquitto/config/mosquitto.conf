# Mosquitto MQTT Broker – LATA Project
# Tài liệu: https://mosquitto.org/man/mosquitto-conf-5.html

# ── Listener plain (internal Docker network only) ─────────────────────────
listener 1883
allow_anonymous true   # TODO: đổi sang false + password_file khi production

# ── Listener TLS (thiết bị ESP32 kết nối từ bên ngoài) ───────────────────
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
# tls_version tlsv1.2
# require_certificate false

# ── Persistence ───────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
