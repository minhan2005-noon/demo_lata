services:

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT plain (internal only)
      - "8883:8883"     # MQTT over TLS (thiết bị kết nối)
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_ADMIN_USER}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=lata
      - DOCKER_INFLUXDB_INIT_BUCKET=wastewater
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}

  nodered:
    image: nodered/node-red:latest
    restart: unless-stopped
    ports:
      - "1880:1880"
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto
      - influxdb
    environment:
      - TZ=Asia/Ho_Chi_Minh

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - influxdb
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false

  api:
    build: ./API
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      - influxdb
      - mosquitto
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=lata
      - INFLUXDB_BUCKET=wastewater
      - INFLUXDB_MEASUREMENT=sensor_reading
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - PORT=8000
      - API_PORT=8000
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=120
      - TRUST_PROXY=true

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ../webapp/dist:/usr/share/nginx/html:ro
    depends_on:
      - api
      - grafana

volumes:
  influxdb_data:
  nodered_data:
  grafana_data:
