; LATA Firmware – PlatformIO Configuration
; Tài liệu: https://docs.platformio.org/en/latest/projectconf/

[platformio]
default_envs = esp32dev

; ── Môi trường chính: ESP32 DevKit V1 ────────────────────────────────────
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, colorize

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM

; Upload
upload_speed = 921600

; ── Thư viện ─────────────────────────────────────────────────────────────
lib_deps =
    ; Modbus RTU master qua RS485
    4-20ma/ModbusMaster @ ^2.0.1

    ; MQTT client (broker: Mosquitto / HiveMQ)
    knolleary/PubSubClient @ ^2.8.0

    ; JSON serialize/deserialize payload
    bblanchon/ArduinoJson @ ^7.1.0

    ; Web server cho AP provisioning (captive portal)
    me-no-dev/AsyncTCP @ ^1.1.1
    me-no-dev/ESP Async WebServer @ ^1.2.4

    ; OLED 128x64 I2C (SSD1306)
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9

    ; DS3231 RTC
    adafruit/RTClib @ ^2.1.4

    ; Preferences (NVS) – built-in ESP32, tidak perlu tambahkan

; ── Môi trường test (chạy trên máy tính, không cần phần cứng) ────────────
[env:native_test]
platform = native
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
